; WuchangMinimap - runtime configuration.
;
; Read once, when the mod initialises. Restart the game after editing.

[navmesh]

; 1 = the runtime dtNavMesh dumper, forced from the F2 panel's Debug tab. It scans
; engine memory, so it is off for normal play. The map background is built offline
; from the paks (tools/navmesh/offline); the runtime dumper covers only cells the paks
; do not carry and navmesh built at runtime.
navmesh_dump = 0
