; WuchangMinimap - runtime configuration
;
; This file is read once, when the mod initialises. Restart the game after editing.

[navmesh]

; The RUNTIME dtNavMesh dumper. OFF by default, and it should normally stay off.
;
; The minimap's map background is built OFFLINE, straight out of the game's paks
; (tools/navmesh/offline in the mod repo): the whole of Chapter 1 in ~8 s, the whole
; game in ~2 min, with 0 % false positives against the game's own navigation probes.
; The runtime dumper only remains useful for
;   * cells that are not in the paks (DLC / patch content), and
;   * navmesh that is carved or rebuilt at runtime.
;
; It scans engine memory and binds a hotkey, so it has no business running during
; normal play. Set it to 1 only for a deliberate capture session.
navmesh_dump = 0

; Key that forces a dump of all four agents (also usable with CTRL held).
; F-keys only, F1..F24. F6, F10 and F12 are REJECTED and fall back to F3:
;   F6  is the RenoDX / DLSS 5 Neural Rendering toggle - pressing it in-world hung the
;       GPU and killed the game on 2026-09-02
;   F10 opens the game console (UE4SS ConsoleEnablerMod)
;   F12 is the Steam screenshot key
navmesh_dump_key = F3
